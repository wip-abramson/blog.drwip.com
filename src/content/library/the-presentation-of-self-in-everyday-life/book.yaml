title: "The Presentation of Self in Everyday Life"
author: Erving Goffman
type: book
status: read

influence: >-
  Instrumental in shaping my thinking during my PhD (2018–2022).

summary: >-
  A classic. Goffman analyses the different ways in which we construct and present ourselves within social interactions through the lens of actors in a play, and our mutual collaboration in maintaining these constructed masks.
