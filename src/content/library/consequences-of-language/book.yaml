title: "Consequences of Language: From Primary to Enhanced Intersubjectivity"
author: N. J. Enfield and Jack Sidnell
type: book
status: read

influence: >-
  Influenced how I thought about language, interaction and the complex webs
  of accountabilities we weave and are ensnared within.

summary: >-
  Intersubjectivity is actively produced through sequences of interaction:
  signs, grammar, artifacts, conventions and social position let people
  coordinate across differing experiences, while norms make action
  intelligible and accountable, and agency both constrains and opens
  possibilities within that structure. Tacit anticipation (“subprehension”)
  keeps interaction flowing, breakdowns in expectation prompt people to infer
  purposes and demand accounts, and the design challenge is building digital
  infrastructure that supports these processes without letting accountability
  and constraint become tyrannical.

