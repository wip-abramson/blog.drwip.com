# What the book argues — its core thesis.
summary: >-
  Defines positive freedom as the value of values and identifies five forms
  of freedom: sovereignty, unpredictability, mobility, factuality and
  solidarity. Each enabling and enabled by the others, all of them necessary
  to sustain and expand freedom.

