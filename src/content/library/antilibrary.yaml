# The Antilibrary — books not yet read.
#
# One block per book. `id` is the slug (used as the deep-link anchor, e.g.
# /library/antilibrary#seeing-like-a-state) and must be unique.
#
# The point of an entry is not the book, it's the *pull*: where the
# recommendation came from, and why it caught. `tags` wire it into /concepts
# alongside the posts, reflections, and read books it will one day join.
#
# Only `title` and `author` are required, and every other field is better
# absent than guessed — a `why` you didn't write, or a year nobody checked, is
# worth less than nothing here. Leave it out; fill it in when you know.
#
# via:
#   who:  who pointed at it
#   where: the occasion, in your words — a podcast, a footnote, a pub
#   url:  the recommendation itself, out on the web (the credit links here)
#   book: slug of a book already in src/content/library/ it came from
#   reflection: slug of a reflection it came from
# `url` and `book`/`reflection` can both be set: the credit links out to the
# recommendation, and a "from <title>" link threads back to the shelf.
#
# When a book is actually read, it graduates: delete the block here and give
# it a folder in src/content/library/<slug>/book.yaml.

