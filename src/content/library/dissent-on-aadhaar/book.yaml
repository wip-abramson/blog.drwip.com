title: "Dissent on Aadhaar"
author: Reetika Khera (ed.)
type: book
status: read

influence: >-
  Instrumental in shaping my thinking during my PhD (2018–2022).

summary: >-
  The impact and consequences of the Indian Government's Aadhaar biometric identification system, told through a series of essays from scholars and activists across the spectrum. A powerful example of how well-meaning technology can cause people to fall through the cracks.
