title: "Liars and Outliers"
author: Bruce Schneier
type: book
status: read

influence: >-
  Instrumental in shaping my thinking during my PhD (2018–2022).

summary: >-
  The impossibility of eliminating defectors, and the tyranny of systems that try. Outliers break rules and drive change. Social mechanisms for inducing trustworthy behaviour, and the scales at which they are effective. The goal is to keep behaviour within acceptable limits.
