title: "The Fourth Revolution"
author: Luciano Floridi
type: book
status: read

influence: >-
  Instrumental in shaping my thinking during my PhD (2018–2022).

summary: >-
  Depicts our current information age as the fourth revolution of humanity: the transition to a hyperhistorical society heavily reliant on third-order technologies that both act and act upon other technologies, creating information and action networks across time and space.
