title: "Privacy: A Short History"
author: David Vincent
type: book
status: read

influence: >-
  Instrumental in shaping my thinking during my PhD (2018–2022).

summary: >-
  An eloquent and insightful presentation of the shifting dimensions of privacy from the 1600s to our present day. Privacy has always been desired, but never complete. Changing environments, social structures and technologies created new possibilities for privacy, but also intrusion and surveillance. As these leant, individual and social expectations of privacy adapted.

